name: Android

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Android Lint
        run: ./gradlew lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wake-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            ./gradlew assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n jp.mizuno.simplewol/.ui.MainActivity
            sleep 3
            mkdir -p preview
            adb exec-out screencap -p > preview/home.png
            if adb logcat -d -t 500 | grep -q 'FATAL EXCEPTION'; then exit 1; fi
      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: wake-emulator-preview
          path: preview/home.png
          if-no-files-found: error
          retention-days: 14
